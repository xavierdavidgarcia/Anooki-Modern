<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Anooki</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: none;
      font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
      background:
        radial-gradient(ellipse at 50% 80%, #1d3a6a 0%, #0a1a30 60%, #02060f 100%);
    }
    #stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage > * {
      width: 100%;
      height: 100%;
    }
    #clock {
      position: absolute;
      right: 4vw;
      bottom: 4vh;
      color: rgba(255,255,255,0.85);
      font-size: 7vh;
      font-weight: 200;
      letter-spacing: -0.02em;
      text-shadow: 0 0 24px rgba(0,0,0,0.55), 0 2px 6px rgba(0,0,0,0.4);
      font-variant-numeric: tabular-nums;
      user-select: none;
      pointer-events: none;
    }
    #date {
      position: absolute;
      right: 4vw;
      bottom: 2.5vh;
      color: rgba(255,255,255,0.55);
      font-size: 2vh;
      font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 0 16px rgba(0,0,0,0.5);
      user-select: none;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="clock">00:00</div>
  <div id="date"></div>
  <script src="ruffle/ruffle.js"></script>
  <script src="player.js"></script>
  <script>
    (function () {
      const clock = document.getElementById('clock');
      const dateEl = document.getElementById('date');
      function tick() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        clock.textContent = `${hh}:${mm}`;
        dateEl.textContent = now.toLocaleDateString(undefined, {
          weekday: 'long', month: 'long', day: 'numeric'
        });
      }
      tick();
      setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
